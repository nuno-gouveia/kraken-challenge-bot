name: snapshot

# Market data for the daily brief. Claude's cloud sessions can't reach
# Kraken, so this job fetches it and commits data/snapshot.json.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Snapshot
        run: |
          python -m src.snapshot
          echo "snapshot: $(date -u +%Y-%m-%d) market data" > "$RUNNER_TEMP/commit-msg"

      - name: Commit snapshot
        run: scripts/commit-state.sh "$RUNNER_TEMP/commit-msg" data/
